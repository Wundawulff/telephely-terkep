<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephely Térkép - Ercsi</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCP93NrYiTMh-Drp56L0-QijhjEa2WB_ig"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #container { display: flex; height: 100vh; }
        #map { flex: 1; }
        #sidebar {
            width: 350px;
            background: #f8f9fa;
            padding: 20px;
            overflow-y: auto;
        }
        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-blue { background: #007bff; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-yellow { background: #ffc107; color: black; }
        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            margin: 5px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .layer-btns {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .layer-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .layer-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .status-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .new-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }
        .photo-list-item {
            padding: 12px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        .photo-list-item.error {
            border-left-color: #dc3545;
        }
        .photo-list-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .photo-list-desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .photo-list-actions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .log {
            background: #f0f0f0;
            padding: 10px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
        }
        @media (max-width: 768px) {
            #container { flex-direction: column; }
            #sidebar { width: 100%; height: 40vh; }
            #map { height: 60vh; }
        }

        /* Filmstrip */
        #filmstrip-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 350px;
            height: 110px;
            background: rgba(20,20,20,0.92);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            overflow-x: auto;
            z-index: 500;
            transition: transform 0.3s ease;
        }
        #filmstrip-container::-webkit-scrollbar { height: 5px; }
        #filmstrip-container::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        #filmstrip-container.hidden { transform: translateY(100%); }
        .film-thumb {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            transition: border-color 0.2s, transform 0.2s;
        }
        .film-thumb:hover { transform: scale(1.08); border-color: #fff; }
        .film-thumb.type-general { border-color: #007bff; }
        .film-thumb.type-error { border-color: #dc3545; }
        .film-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .film-thumb .film-label {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 9px;
            padding: 2px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .film-thumb .film-badge {
            position: absolute;
            top: 3px; right: 3px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #28a745;
        }
        #filmstrip-toggle {
            position: fixed;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,20,0.85);
            color: #fff;
            border: none;
            border-radius: 20px 20px 0 0;
            padding: 5px 18px;
            cursor: pointer;
            font-size: 13px;
            z-index: 501;
        }
        #filmstrip-count {
            color: #aaa;
            font-size: 12px;
            white-space: nowrap;
            padding: 0 6px;
        }
        @media (max-width: 768px) {
            #filmstrip-container { right: 0; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <h1>📍 Telephely Térkép</h1>

            <button class="btn btn-yellow" onclick="setupToken()">🔑 Token beállítása</button>
            <div class="status">
                Token: <span id="tokenText">❌ Nincs</span>
            </div>

            <div class="status" id="newPhotosPanel" style="display: none;">
                <div class="status-title">🆕 Új fotók az utolsó látogatás óta:</div>
                <div class="status-item">
                    📷 Összesen: <strong id="newTotalCount">0</strong> új fotó
                </div>
                <div class="status-item">
                    🔵 Általános: <strong id="newGeneralCount">0</strong> db
                </div>
                <div class="status-item">
                    🔴 Hibák: <strong id="newErrorCount">0</strong> db
                </div>
                <div class="status-item" style="font-size: 12px; color: #666; padding-top: 10px;">
                    Utolsó látogatás: <span id="lastVisit">-</span>
                </div>
            </div>

            <div class="layer-btns">
                <button class="layer-btn active" onclick="setLayer('all')">📊 Összes</button>
                <button class="layer-btn" onclick="setLayer('general')">🔵 Általános</button>
                <button class="layer-btn" onclick="setLayer('error')">🔴 Hibák</button>
            </div>

            <button class="btn btn-blue" onclick="takePhoto('general')" id="btnGeneral">📷 Általános fotó</button>
            <button class="btn btn-red" onclick="takePhoto('error')" id="btnError">🔴 Hiba fotó</button>

            <div class="status" id="status">📷 0 fotó (🔵 0 | 🔴 0)</div>

            <div class="log" id="log">📋 Log:<br></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            owner: 'Wundawulff',
            repo: 'telephely-terkep',
            branch: 'main',
            nearbyThreshold: 5
        };

        let map;
        let token = localStorage.getItem('github_token');
        let photos = [];
        let markers = [];
        let wedges = [];
        let currentLayer = 'all';
        let lastVisitTimestamp = localStorage.getItem('last_visit_timestamp');
        let newPhotosCount = { total: 0, general: 0, error: 0 };

        function log(msg) {
            const d = new Date();
            const time = d.toLocaleTimeString();
            document.getElementById('log').innerHTML += `[${time}] ${msg}<br>`;
            document.getElementById('log').scrollTop = 999999;
            console.log('[LOG]', msg);
        }

        function setupToken() {
            const t = prompt('GitHub token (ghp_...):');
            if (t && t.startsWith('ghp_')) {
                token = t.trim();
                localStorage.setItem('github_token', token);
                updateUI();
                alert('✅ Token beállítva!');
                log('Token beállítva');
            } else {
                alert('❌ Érvénytelen token!');
            }
        }

        function updateUI() {
            const hasToken = !!token;
            document.getElementById('tokenText').textContent = hasToken ? '✅ Beállítva' : '❌ Nincs';
            document.getElementById('btnGeneral').disabled = !hasToken;
            document.getElementById('btnError').disabled = !hasToken;
        }

        function updateStatus() {
            const generalCount = photos.filter(p => p.type === 'general').length;
            const errorCount = photos.filter(p => p.type === 'error').length;
            document.getElementById('status').textContent = 
                `📷 ${photos.length} fotó (🔵 ${generalCount} | 🔴 ${errorCount})`;
        }

        function updateNewPhotosPanel() {
            if (newPhotosCount.total > 0) {
                document.getElementById('newPhotosPanel').style.display = 'block';
                document.getElementById('newTotalCount').textContent = newPhotosCount.total;
                document.getElementById('newGeneralCount').textContent = newPhotosCount.general;
                document.getElementById('newErrorCount').textContent = newPhotosCount.error;

                if (lastVisitTimestamp) {
                    const lastVisitDate = new Date(parseInt(lastVisitTimestamp));
                    document.getElementById('lastVisit').textContent = lastVisitDate.toLocaleString('hu-HU');
                } else {
                    document.getElementById('lastVisit').textContent = 'Első látogatás';
                }

                log(`🆕 ${newPhotosCount.total} új fotó az utolsó látogatás óta`);
            } else {
                document.getElementById('newPhotosPanel').style.display = 'none';
            }
        }

        function markVisit() {
            const now = Date.now();
            localStorage.setItem('last_visit_timestamp', now.toString());
            log('Látogatás rögzítve');
        }

        function getDistance(lat1, lng1, lat2, lng2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lng2 - lng1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        function getNearbyPhotos(lat, lng) {
            const nearby = [];
            photos.forEach((p, i) => {
                const distance = getDistance(lat, lng, p.coords.lat, p.coords.lng);
                if (distance <= CONFIG.nearbyThreshold) {
                    nearby.push(i);
                }
            });
            return nearby;
        }

        function createListPopup(photoIndices) {
            const lastVisit = lastVisitTimestamp ? parseInt(lastVisitTimestamp) : 0;

            // Filter indices by current layer
            let visibleIndices = photoIndices;
            if (currentLayer === 'general') {
                visibleIndices = photoIndices.filter(i => photos[i].type === 'general');
            } else if (currentLayer === 'error') {
                visibleIndices = photoIndices.filter(i => photos[i].type === 'error');
            }
            if (visibleIndices.length === 0) visibleIndices = photoIndices; // fallback

            if (visibleIndices.length === 1) {
                return createSinglePhotoPopup(visibleIndices[0]);
            }

            let content = `
                <div style="max-width:320px; font-family:Arial,sans-serif; padding:5px;">
                    <div style="font-weight:bold; margin-bottom:12px; font-size:15px; border-bottom:2px solid #ddd; padding-bottom:8px;">
                        📍 ${visibleIndices.length} fotó ezen a helyen:
                    </div>
            `;

            visibleIndices.forEach(index => {
                const photo = photos[index];
                const photoTime = new Date(photo.timestamp).getTime();
                const isNew = photoTime > lastVisit;
                const typeLabel = photo.type === 'general' ? '🔵 ÁLTALÁNOS' : '🔴 HIBA';
                const borderColor = photo.type === 'general' ? '#007bff' : '#dc3545';

                content += `
                    <div style="padding:10px; margin:8px 0; background:#f8f9fa; border-radius:8px; border-left:4px solid ${borderColor};">
                        <div style="font-weight:bold; margin-bottom:5px; font-size:14px;">
                            ${typeLabel}
                            ${isNew ? '<span style="display:inline-block;background:#28a745;color:white;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:bold;margin-left:5px;">ÚJ</span>' : ''}
                        </div>
                        ${photo.description ? `<div style="font-size:12px;color:#444;margin-bottom:4px;">📝 ${photo.description}</div>` : ''}
                        <div style="font-size:11px;color:#888;margin-bottom:8px;">📅 ${photo.timestamp}</div>
                        <div style="display:flex;gap:6px;">
                            <button onclick="event.stopPropagation(); showSinglePhoto(${index})"
                                style="flex:1;padding:7px 10px;background:#007bff;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">
                                👁️ Megtekintés
                            </button>
                            <button onclick="event.stopPropagation(); deletePhoto(${index})"
                                style="flex:1;padding:7px 10px;background:#dc3545;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;">
                                🗑️ Törlés
                            </button>
                        </div>
                    </div>
                `;
            });

            content += `</div>`;
            return content;
        }

        function createSinglePhotoPopup(photoIndex) {
            const photo = photos[photoIndex];
            const lastVisit = lastVisitTimestamp ? parseInt(lastVisitTimestamp) : 0;
            const photoTime = new Date(photo.timestamp).getTime();
            const isNew = photoTime > lastVisit;

            const imgPath = photo.type === 'general' 
                ? `images/altalanos/${photo.name}`
                : `images/hibak/${photo.name}`;
            const imgUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${imgPath}`;

            return `
                <div style="max-width:280px; font-family:Arial,sans-serif; padding:5px;">
                    <img src="${imgUrl}" style="width:100%; border-radius:8px; margin-bottom:10px; display:block;">
                    <div style="font-weight:bold; margin-bottom:6px; font-size:14px;">
                        ${photo.type === 'general' ? '🔵 ÁLTALÁNOS' : '🔴 HIBA'}
                        ${isNew ? '<span style="display:inline-block;background:#28a745;color:white;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:bold;margin-left:5px;">ÚJ</span>' : ''}
                    </div>
                    ${photo.description ? `<div style="font-size:13px;color:#444;margin-bottom:5px;">📝 ${photo.description}</div>` : ''}
                    <div style="font-size:12px;color:#888;margin-bottom:4px;">📅 ${photo.timestamp}</div>
                    <div style="font-size:11px;color:#aaa;margin-bottom:10px;">📍 ${photo.coords.lat.toFixed(6)}, ${photo.coords.lng.toFixed(6)}</div>
                    <button onclick="deletePhoto(${photoIndex})"
                        style="width:100%;padding:10px;background:#dc3545;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:bold;">
                        🗑️ Törlés
                    </button>
                </div>
            `;
        }

        window.showSinglePhoto = function(photoIndex) {
            const marker = markers.find(m => m.photoIndices && m.photoIndices.includes(photoIndex));
            if (marker) {
                const infoWindow = new google.maps.InfoWindow({
                    content: createSinglePhotoPopup(photoIndex)
                });
                infoWindow.open(map, marker);
            }
        };

        window.deletePhoto = async function(photoIndex) {
            if (!confirm('Biztosan törölni szeretnéd ezt a fotót?')) {
                return;
            }

            if (!token) {
                alert('⚠️ Token szükséges a törléshez!');
                return;
            }

            log(`Fotó törlése: ${photos[photoIndex].name}`);

            try {
                const photo = photos[photoIndex];
                const imagePath = photo.type === 'general' 
                    ? `images/altalanos/${photo.name}`
                    : `images/hibak/${photo.name}`;

                // Kép SHA lekérése
                const imgResponse = await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${imagePath}`,
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                if (imgResponse.ok) {
                    const imgData = await imgResponse.json();

                    // Kép törlése
                    await fetch(
                        `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${imagePath}`,
                        {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `Fotó törlése: ${photo.name}`,
                                sha: imgData.sha,
                                branch: CONFIG.branch
                            })
                        }
                    );
                    log('Kép törölve GitHub-ról');
                }

                // Fotó eltávolítása a listából
                photos.splice(photoIndex, 1);

                // data.json frissítése
                await updateDataJson();

                log('✅ Fotó sikeresen törölve!');
                alert('✅ Fotó törölve!');

                // Markerek újrarenderelése
                renderMarkers();
                updateStatus();

            } catch (err) {
                log(`❌ Törlési hiba: ${err.message}`);
                alert('❌ Törlési hiba: ' + err.message);
                console.error(err);
            }
        };

        function initMap() {
            log('Térkép betöltése...');
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 47.248355, lng: 18.872946 },
                zoom: 19,
                mapTypeId: 'satellite'
            });

            new google.maps.Marker({
                position: { lat: 47.248355, lng: 18.872946 },
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: '#ff0000',
                    fillOpacity: 1,
                    strokeColor: '#ffffff',
                    strokeWeight: 2
                },
                title: 'Telephely központ'
            });

            updateUI();
            log('Térkép kész');

            loadPhotosFromGitHub();
        }

        function loadPhotosFromGitHub() {
            log('Fotók betöltése GitHub-ról...');

            fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/data.json`, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    log('Nincs még data.json fájl');
                    return null;
                }
            })
            .then(data => {
                if (data) {
                    photos = JSON.parse(atob(data.content));
                    log(`${photos.length} fotó betöltve`);

                    if (lastVisitTimestamp) {
                        const lastVisit = parseInt(lastVisitTimestamp);
                        photos.forEach(photo => {
                            const photoTime = new Date(photo.timestamp).getTime();
                            if (photoTime > lastVisit) {
                                newPhotosCount.total++;
                                if (photo.type === 'general') {
                                    newPhotosCount.general++;
                                } else {
                                    newPhotosCount.error++;
                                }
                            }
                        });
                    }

                    updateNewPhotosPanel();
                    renderMarkers();
                    updateStatus();

                    setTimeout(() => {
                        markVisit();
                    }, 5000);
                }
            })
            .catch(err => {
                log(`Betöltési hiba: ${err.message}`);
            });
        }

        function makeSplitIcon(hasGeneral, hasError, hasNew, scale) {
            // SVG split-circle: left half blue (general), right half red (error)
            // If only one type, full circle of that color
            const s = scale || 10;
            const r = s;
            const size = r * 2 + 6;
            const cx = size / 2;
            const cy = size / 2;
            const stroke = hasNew ? '#00ff00' : '#ffffff';
            const sw = hasNew ? 3 : 2;

            let circleSvg;
            if (hasGeneral && hasError) {
                // Left half = blue, right half = red
                circleSvg = `
                    <path d="M${cx},${cy} m-${r},0 a${r},${r} 0 0,1 ${r*2},0 Z" fill="#007bff"/>
                    <path d="M${cx},${cy} m${r},0 a${r},${r} 0 0,1 -${r*2},0 Z" fill="#dc3545"/>
                    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>
                `;
            } else {
                const color = hasGeneral ? '#007bff' : '#dc3545';
                circleSvg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="${stroke}" stroke-width="${sw}"/>`;
            }

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">${circleSvg}</svg>`;
            return {
                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                scaledSize: new google.maps.Size(size, size),
                anchor: new google.maps.Point(cx, cy)
            };
        }

        function renderMarkers() {
            markers.forEach(m => m.setMap(null));
            wedges.forEach(w => w.setMap(null));
            markers = [];
            wedges = [];

            const lastVisit = lastVisitTimestamp ? parseInt(lastVisitTimestamp) : 0;
            const processedPhotos = new Set();

            photos.forEach((photo, index) => {
                if (processedPhotos.has(index)) return;

                const nearbyIndices = getNearbyPhotos(photo.coords.lat, photo.coords.lng);
                nearbyIndices.forEach(i => processedPhotos.add(i));

                const types = nearbyIndices.map(i => photos[i].type);
                const hasGeneral = types.includes('general');
                const hasError = types.includes('error');
                const wedgeColor = hasError ? '#ff6b6b' : '#FFD700';

                const hasNew = nearbyIndices.some(i => {
                    const photoTime = new Date(photos[i].timestamp).getTime();
                    return photoTime > lastVisit;
                });

                const scale = hasNew ? 12 : 10;
                const icon = makeSplitIcon(hasGeneral, hasError, hasNew, scale);

                const marker = new google.maps.Marker({
                    position: photo.coords,
                    map: map,
                    icon: icon,
                    draggable: true,
                    title: nearbyIndices.length > 1 ? `${nearbyIndices.length} fotó` : photo.name,
                    animation: hasNew ? google.maps.Animation.BOUNCE : null
                });

                if (hasNew) {
                    setTimeout(() => {
                        marker.setAnimation(null);
                    }, 3000);
                }

                marker.photoTypes = types;
                marker.photoType = photo.type;
                marker.photoIndices = nearbyIndices;
                markers.push(marker);

                const wedge = createWedge(photo.coords, photo.direction || 0, wedgeColor);
                wedge.photoType = photo.type;
                wedges.push(wedge);

                marker.addListener('dragend', async () => {
                    const newPos = marker.getPosition();
                    log(`Marker mozgatva: ${newPos.lat()}, ${newPos.lng()}`);

                    const nearbyAtNewPos = getNearbyPhotos(newPos.lat(), newPos.lng());

                    if (nearbyAtNewPos.length > 0 && !nearbyAtNewPos.every(i => nearbyIndices.includes(i))) {
                        log(`Egyesítés: ${nearbyIndices.length} + ${nearbyAtNewPos.length} fotó`);
                        const allIndices = [...new Set([...nearbyIndices, ...nearbyAtNewPos])];
                        allIndices.forEach(i => {
                            photos[i].coords = { lat: newPos.lat(), lng: newPos.lng() };
                        });
                    } else {
                        nearbyIndices.forEach(i => {
                            photos[i].coords = { lat: newPos.lat(), lng: newPos.lng() };
                        });
                    }

                    await updateDataJson();
                    renderMarkers();
                });

                marker.addListener('click', () => {
                    const infoWindow = new google.maps.InfoWindow({
                        content: createListPopup(nearbyIndices)
                    });
                    infoWindow.open(map, marker);
                });
            });

            filterMarkers();
            updateFilmstrip();
            log('Markerek renderelve');
        }

        function createWedge(center, direction, color) {
            const radius = 9;
            const angle = 45;
            const points = [center];

            for (let i = -angle / 2; i <= angle / 2; i += 5) {
                const heading = (direction + i + 360) % 360;
                const rad = (heading * Math.PI) / 180;
                const lat = center.lat + (radius / 111320) * Math.cos(rad);
                const lng = center.lng + (radius / (111320 * Math.cos(center.lat * Math.PI / 180))) * Math.sin(rad);
                points.push({ lat, lng });
            }
            points.push(center);

            return new google.maps.Polygon({
                paths: points,
                strokeColor: color,
                strokeOpacity: 0.6,
                strokeWeight: 1,
                fillColor: color,
                fillOpacity: 0.2,
                map: map
            });
        }

        function setLayer(layer) {
            currentLayer = layer;
            document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            filterMarkers();
            updateFilmstrip();
        }

        function filterMarkers() {
            markers.forEach((marker, i) => {
                let show = false;
                if (currentLayer === 'all') {
                    show = true;
                } else if (currentLayer === 'general') {
                    // Show if ANY photo in this group is 'general'
                    show = marker.photoTypes 
                        ? marker.photoTypes.includes('general')
                        : marker.photoType === 'general';
                } else if (currentLayer === 'error') {
                    // Show if ANY photo in this group is 'error'
                    show = marker.photoTypes 
                        ? marker.photoTypes.includes('error')
                        : marker.photoType === 'error';
                }
                marker.setVisible(show);
                wedges[i].setVisible(show);
            });
        }

        async function takePhoto(type) {
            log(`Fotózás indítása: ${type}`);

            if (!token) {
                alert('⚠️ Először állítsd be a tokent!');
                return;
            }

            try {
                log('Kamera indítása...');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                log('Kamera OK');

                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;object-fit:cover;';
                document.body.appendChild(video);

                const btn = document.createElement('button');
                btn.textContent = '📷 FOTÓ';
                btn.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:20px 40px;font-size:24px;background:#28a745;color:white;border:none;border-radius:50px;z-index:10000;cursor:pointer;';
                document.body.appendChild(btn);

                const closeBtn = document.createElement('button');
                closeBtn.textContent = '✖';
                closeBtn.style.cssText = 'position:fixed;top:20px;right:20px;padding:15px 20px;font-size:20px;background:#dc3545;color:white;border:none;border-radius:50%;z-index:10000;cursor:pointer;';
                document.body.appendChild(closeBtn);

                closeBtn.onclick = () => {
                    stream.getTracks().forEach(t => t.stop());
                    video.remove();
                    btn.remove();
                    closeBtn.remove();
                    log('Fotózás megszakítva');
                };

                btn.onclick = () => {
                    log('Fotó készítése...');

                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                    stream.getTracks().forEach(t => t.stop());
                    video.remove();
                    btn.remove();
                    closeBtn.remove();

                    log('Fotó kész, GPS lekérése...');

                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            log(`GPS OK: ${pos.coords.latitude}, ${pos.coords.longitude}`);

                            const coords = {
                                lat: pos.coords.latitude,
                                lng: pos.coords.longitude
                            };

                            log('Leírás kérése...');
                            const desc = prompt(type === 'error' ? '🔴 Hiba leírása:' : '📝 Leírás (pl: Földszint, Emelet):') || '';
                            log(`Leírás: "${desc}"`);

                            log('🚀 FELTÖLTÉS INDÍTÁSA...');
                            uploadPhoto(type, dataUrl, coords, desc);
                        },
                        (err) => {
                            log(`❌ GPS HIBA: ${err.message}`);
                            alert('❌ GPS hiba: ' + err.message);
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                };

            } catch (err) {
                log(`❌ Kamera hiba: ${err.message}`);
                alert('❌ Kamera hiba: ' + err.message);
            }
        }

        function uploadPhoto(type, dataUrl, coords, desc) {
            log('uploadPhoto() függvény meghívva');

            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
            const filename = `foto_${new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19)}.jpg`;
            const imagePath = type === 'general' ? `images/altalanos/${filename}` : `images/hibak/${filename}`;
            const imageContent = dataUrl.split(',')[1];

            log(`Kép feltöltése: ${imagePath}`);

            fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${imagePath}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Fotó: ${filename}`,
                    content: imageContent,
                    branch: CONFIG.branch
                })
            })
            .then(response => {
                log(`Kép feltöltés válasz: ${response.status}`);
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(() => {
                log('✅ Kép feltöltve!');

                photos.push({
                    name: filename,
                    type: type,
                    coords: coords,
                    direction: 0,
                    description: desc,
                    timestamp: timestamp
                });

                log(`Új fotók száma: ${photos.length}`);

                return updateDataJson();
            })
            .then(() => {
                log('✅✅✅ FELTÖLTÉS SIKERES! ✅✅✅');
                alert('✅ Fotó feltöltve! Húzd a helyes helyre a markert!');

                renderMarkers();
                updateStatus();
            })
            .catch(err => {
                log(`❌ HIBA: ${err.message}`);
                alert('❌ Feltöltési hiba: ' + err.message);
                console.error(err);
            });
        }

        async function updateDataJson() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/data.json`,
                    {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                let sha = null;
                if (response.ok) {
                    const data = await response.json();
                    sha = data.sha;
                }

                const photoData = photos.map(p => ({
                    name: p.name,
                    type: p.type,
                    coords: p.coords,
                    direction: p.direction,
                    description: p.description,
                    timestamp: p.timestamp
                }));

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(photoData, null, 2))));

                const body = {
                    message: 'Fotó adatok frissítése',
                    content: content,
                    branch: CONFIG.branch
                };

                if (sha) {
                    body.sha = sha;
                }

                await fetch(
                    `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/data.json`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    }
                );

                log('data.json frissítve');

            } catch (error) {
                log(`data.json frissítési hiba: ${error.message}`);
                console.error('data.json frissítési hiba:', error);
            }
        }


        // ── FILMSTRIP ──────────────────────────────────────────────
        let filmstripVisible = true;

        function toggleFilmstrip() {
            filmstripVisible = !filmstripVisible;
            const el = document.getElementById('filmstrip-container');
            const btn = document.getElementById('filmstrip-toggle');
            if (filmstripVisible) {
                el.classList.remove('hidden');
                btn.textContent = '🎞️ Fotótár ▲';
            } else {
                el.classList.add('hidden');
                btn.textContent = '🎞️ Fotótár ▼';
            }
        }

        function updateFilmstrip() {
            const container = document.getElementById('filmstrip-container');
            const countEl = document.getElementById('filmstrip-count');
            const lastVisit = lastVisitTimestamp ? parseInt(lastVisitTimestamp) : 0;

            // Filter photos by current layer
            let filtered = photos.map((p, i) => ({ ...p, _idx: i }));
            if (currentLayer === 'general') {
                filtered = filtered.filter(p => p.type === 'general');
            } else if (currentLayer === 'error') {
                filtered = filtered.filter(p => p.type === 'error');
            }

            // Clear existing thumbs (keep count span)
            Array.from(container.children).forEach(c => {
                if (c.id !== 'filmstrip-count') c.remove();
            });

            countEl.textContent = `${filtered.length} fotó`;

            if (filtered.length === 0) {
                countEl.textContent = 'Nincs fotó ebben a nézetben';
                return;
            }

            filtered.forEach(photo => {
                const imgPath = photo.type === 'general'
                    ? `images/altalanos/${photo.name}`
                    : `images/hibak/${photo.name}`;
                const imgUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${imgPath}`;
                const photoTime = new Date(photo.timestamp).getTime();
                const isNew = photoTime > lastVisit;

                const thumb = document.createElement('div');
                thumb.className = `film-thumb type-${photo.type}`;
                thumb.title = (photo.description || photo.name) + '\n' + photo.timestamp;

                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = photo.description || photo.name;
                img.loading = 'lazy';

                const label = document.createElement('div');
                label.className = 'film-label';
                label.textContent = photo.description || photo.name;

                thumb.appendChild(img);
                thumb.appendChild(label);

                if (isNew) {
                    const badge = document.createElement('div');
                    badge.className = 'film-badge';
                    thumb.appendChild(badge);
                }

                thumb.addEventListener('click', () => {
                    focusPhotoOnMap(photo._idx);
                });

                container.appendChild(thumb);
            });
        }

        function focusPhotoOnMap(photoIndex) {
            const photo = photos[photoIndex];
            if (!photo) return;

            // Pan to photo location
            map.panTo(photo.coords);
            map.setZoom(20);

            // Find the marker that contains this photo
            const targetMarker = markers.find(m => m.photoIndices && m.photoIndices.includes(photoIndex));
            if (targetMarker) {
                // Open popup
                const infoWindow = new google.maps.InfoWindow({
                    content: createListPopup(targetMarker.photoIndices)
                });
                infoWindow.open(map, targetMarker);

                // Bounce animation
                targetMarker.setAnimation(google.maps.Animation.BOUNCE);
                setTimeout(() => targetMarker.setAnimation(null), 1500);
            }
        }
        // ── END FILMSTRIP ──────────────────────────────────────────

        window.onload = initMap;
    </script>

    <button id="filmstrip-toggle" onclick="toggleFilmstrip()">🎞️ Fotótár ▲</button>
    <div id="filmstrip-container">
        <span id="filmstrip-count">Betöltés...</span>
    </div>

</body>
</html>
