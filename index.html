<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telephely Térkép - SIMPLE</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCP93NrYiTMh-Drp56L0-QijhjEa2WB_ig"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #container { display: flex; height: 100vh; }
        #map { flex: 1; }
        #sidebar {
            width: 350px;
            background: #f8f9fa;
            padding: 20px;
            overflow-y: auto;
        }
        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-blue { background: #007bff; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-yellow { background: #ffc107; color: black; }
        .log {
            background: #f0f0f0;
            padding: 10px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 11px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
        }
        @media (max-width: 768px) {
            #container { flex-direction: column; }
            #sidebar { width: 100%; height: 40vh; }
            #map { height: 60vh; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="sidebar">
            <h1>📍 Telephely Térkép</h1>

            <button class="btn btn-yellow" onclick="setupToken()">🔑 Token beállítása</button>
            <div id="tokenStatus" style="padding: 10px; margin: 10px 0; background: #fff; border-radius: 5px;">
                Token: <span id="tokenText">❌ Nincs</span>
            </div>

            <button class="btn btn-blue" onclick="takePhoto('general')" id="btnGeneral">📷 Általános fotó</button>
            <button class="btn btn-red" onclick="takePhoto('error')" id="btnError">🔴 Hiba fotó</button>

            <div class="log" id="log">📋 Log:<br></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            owner: 'Wundawulff',
            repo: 'telephely-terkep',
            branch: 'main'
        };

        let map;
        let token = localStorage.getItem('github_token');

        function log(msg) {
            const d = new Date();
            const time = d.toLocaleTimeString();
            document.getElementById('log').innerHTML += `[${time}] ${msg}<br>`;
            document.getElementById('log').scrollTop = 999999;
            console.log('[LOG]', msg);
        }

        function setupToken() {
            const t = prompt('GitHub token (ghp_...):');
            if (t && t.startsWith('ghp_')) {
                token = t.trim();
                localStorage.setItem('github_token', token);
                updateUI();
                alert('✅ Token beállítva!');
                log('Token beállítva');
            } else {
                alert('❌ Érvénytelen token!');
            }
        }

        function updateUI() {
            const hasToken = !!token;
            document.getElementById('tokenText').textContent = hasToken ? '✅ Beállítva' : '❌ Nincs';
            document.getElementById('btnGeneral').disabled = !hasToken;
            document.getElementById('btnError').disabled = !hasToken;
        }

        function initMap() {
            log('Térkép betöltése...');
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 47.248355, lng: 18.872946 },
                zoom: 19,
                mapTypeId: 'satellite'
            });

            new google.maps.Marker({
                position: { lat: 47.248355, lng: 18.872946 },
                map: map,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: '#ff0000',
                    fillOpacity: 1,
                    strokeColor: '#ffffff',
                    strokeWeight: 2
                }
            });

            updateUI();
            log('Térkép kész');
        }

        async function takePhoto(type) {
            log(`Fotózás indítása: ${type}`);

            if (!token) {
                alert('⚠️ Először állítsd be a tokent!');
                return;
            }

            try {
                // 1. KAMERA
                log('Kamera indítása...');
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                log('Kamera OK');

                // Video elem
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;object-fit:cover;';
                document.body.appendChild(video);

                // Fotó gomb
                const btn = document.createElement('button');
                btn.textContent = '📷 FOTÓ';
                btn.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:20px 40px;font-size:24px;background:#28a745;color:white;border:none;border-radius:50px;z-index:10000;cursor:pointer;';
                document.body.appendChild(btn);

                // Bezár gomb
                const closeBtn = document.createElement('button');
                closeBtn.textContent = '✖';
                closeBtn.style.cssText = 'position:fixed;top:20px;right:20px;padding:15px 20px;font-size:20px;background:#dc3545;color:white;border:none;border-radius:50%;z-index:10000;cursor:pointer;';
                document.body.appendChild(closeBtn);

                closeBtn.onclick = () => {
                    stream.getTracks().forEach(t => t.stop());
                    video.remove();
                    btn.remove();
                    closeBtn.remove();
                    log('Fotózás megszakítva');
                };

                btn.onclick = () => {
                    log('Fotó készítése...');

                    // Canvas
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                    // Cleanup
                    stream.getTracks().forEach(t => t.stop());
                    video.remove();
                    btn.remove();
                    closeBtn.remove();

                    log('Fotó kész, GPS lekérése...');

                    // 2. GPS
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            log(`GPS OK: ${pos.coords.latitude}, ${pos.coords.longitude}`);

                            const coords = {
                                lat: pos.coords.latitude,
                                lng: pos.coords.longitude
                            };

                            // 3. LEÍRÁS
                            log('Leírás kérése...');
                            const desc = prompt(type === 'error' ? '🔴 Hiba leírása:' : '📝 Leírás:') || '';
                            log(`Leírás: "${desc}"`);

                            // 4. FELTÖLTÉS
                            log('🚀 FELTÖLTÉS INDÍTÁSA...');
                            uploadPhoto(type, dataUrl, coords, desc);
                        },
                        (err) => {
                            log(`❌ GPS HIBA: ${err.message}`);
                            alert('❌ GPS hiba: ' + err.message);
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                };

            } catch (err) {
                log(`❌ Kamera hiba: ${err.message}`);
                alert('❌ Kamera hiba: ' + err.message);
            }
        }

        function uploadPhoto(type, dataUrl, coords, desc) {
            log('uploadPhoto() függvény meghívva');

            const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
            const filename = `foto_${new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19)}.jpg`;
            const imagePath = type === 'general' ? `images/altalanos/${filename}` : `images/hibak/${filename}`;
            const imageContent = dataUrl.split(',')[1];

            log(`Kép feltöltése: ${imagePath}`);

            // FETCH #1: Kép feltöltése
            fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${imagePath}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Fotó: ${filename}`,
                    content: imageContent,
                    branch: CONFIG.branch
                })
            })
            .then(response => {
                log(`Kép feltöltés válasz: ${response.status}`);
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(() => {
                log('✅ Kép feltöltve!');
                log('data.json frissítése...');

                // FETCH #2: data.json lekérése
                return fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/data.json`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    log('data.json még nem létezik');
                    return null;
                }
            })
            .then(existingData => {
                let photos = [];
                let sha = null;

                if (existingData) {
                    photos = JSON.parse(atob(existingData.content));
                    sha = existingData.sha;
                    log(`Meglévő fotók: ${photos.length}`);
                }

                // Új fotó hozzáadása
                photos.push({
                    name: filename,
                    type: type,
                    coords: coords,
                    direction: 0,
                    description: desc,
                    timestamp: timestamp
                });

                log(`Új fotók száma: ${photos.length}`);

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(photos, null, 2))));

                const body = {
                    message: 'Fotó adatok frissítése',
                    content: content,
                    branch: CONFIG.branch
                };

                if (sha) {
                    body.sha = sha;
                }

                // FETCH #3: data.json feltöltése
                return fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/data.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
            })
            .then(response => {
                log(`data.json feltöltés válasz: ${response.status}`);
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(() => {
                log('✅✅✅ FELTÖLTÉS SIKERES! ✅✅✅');
                alert('✅ Fotó sikeresen feltöltve GitHub-ra!');
            })
            .catch(err => {
                log(`❌ HIBA: ${err.message}`);
                alert('❌ Feltöltési hiba: ' + err.message);
                console.error(err);
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
